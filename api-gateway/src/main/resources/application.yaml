
spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/servitec}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/servitec/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-solicitudes
              uri: ${SERVICES_SOLICITUDES_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/solicitudes/**

            - id: ms-trabajos
              uri: ${SERVICES_SOLICITUDES_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/trabajos/**

            - id: ms-tecnicos
              uri: ${SERVICES_TECNICOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tecnicos/**,/api/v1/especialidades/**

server:
  port: 8081
