spring:
  application:
    name: ms-solicitudes

  datasource:
    url: jdbc:postgresql://localhost:5434/servitec_solicitudes
    username: servitec
    password: ${SOLICITUDES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/servitec

      client:
        registration:
          tecnicos-service:
            provider: keycloak
            client-id: ms-solicitudes
            client-secret: ${MS_SOLICITUDES_CLIENT_SECRET}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/servitec/protocol/openid-connect/token

servicios:
  tecnicos:
    url: http://localhost:8082
