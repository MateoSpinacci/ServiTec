spring:
  application:
    name: ms-solicitudes

  datasource:
    url: jdbc:postgresql://localhost:5434/servitec_solicitudes
    username: servitec
    password: ${SOLICITUDES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

servicios:
  tecnicos:
    url: http://localhost:8082