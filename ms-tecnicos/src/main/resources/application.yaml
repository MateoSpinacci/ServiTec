spring:
  application:
    name: ms-tecnicos

  security:
      oauth2:
          resourceserver:
              jwt:
                  issuer-uri: http://localhost:8180/realms/servitec

  datasource:
    url: jdbc:postgresql://localhost:5433/servitec_tecnicos
    username: servitec
    password: ${TECNICOS_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

openrouteservice:
  api-key: ${ORS_API_KEY}
  base-url: https://api.openrouteservice.org

server:
  port: 8082
